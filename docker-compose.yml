services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: intel_mini
      POSTGRES_USER: intel_mini
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in root .env}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intel_mini -d intel_mini"]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    build: {context: ., dockerfile: backend/Dockerfile}
    env_file: backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://intel_mini:${POSTGRES_PASSWORD}@db:5432/intel_mini
      ALLOWED_ORIGINS: http://localhost:8080
    volumes:
      - ./backend/ai_models:/srv/backend/ai_models:ro
      - media_data:/srv/backend/storage
    depends_on:
      db: {condition: service_healthy}
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:create_app --factory --host 0.0.0.0 --port 8000 --workers 1"]
  frontend:
    build: {context: ., dockerfile: frontend/Dockerfile}
    ports: ["127.0.0.1:8080:80"]
    depends_on: [backend]
volumes:
  postgres_data:
  media_data:
