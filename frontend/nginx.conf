server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 1026m;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy no-referrer;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob:; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'self'";
    location /api/ { proxy_pass http://backend:8000; proxy_set_header Host $host; proxy_read_timeout 3600s; proxy_buffering off; }
    location /ws/ { proxy_pass http://backend:8000; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_read_timeout 3600s; }
    location / { try_files $uri $uri/ /index.html; }
}
